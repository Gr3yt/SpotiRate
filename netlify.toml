[build]
  publish = "public"
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/artist"
  to = "/artist.html"
  status = 200

[[redirects]]
  from = "/saved"
  to = "/saved.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"