<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotiRate — Signing in...</title>
<link rel="icon" type="image/png" href="/images/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { background:#0d0d0d; color:#f0f0f0; font-family:'Space Mono',monospace; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; flex-direction:column; gap:1rem; }
  .dot { width:10px; height:10px; background:#1DB954; border-radius:50%; box-shadow:0 0 12px #1DB954; animation:pulse 1s ease-in-out infinite; }
  .msg { font-size:0.7rem; letter-spacing:0.1em; color:#666; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>
<div class="dot"></div>
<div class="msg">SIGNING IN...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script>
  // Wait for auth to init then redirect
  document.addEventListener('DOMContentLoaded', async () => {
    await initAuth();
    setTimeout(() => { window.location.href = '/'; }, 800);
  });
</script>
</body>
</html>
